<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Zia ul Hussain — Software Engineer</title>
  <desc id="desc">A midnight navy banner with electric blue orbital artwork. Building useful things with code and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#080e1c"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#397bff" stop-opacity=".24"/><stop offset="1" stop-color="#397bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a1d7ff"/><stop offset=".5" stop-color="#6197ff"/><stop offset="1" stop-color="#856aff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#8395bd" stroke-opacity=".055"/></pattern>
    <clipPath id="crop"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#crop)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <ellipse cx="990" cy="180" rx="340" ry="310" fill="url(#glow)"/>
    <path d="M0 0H1200" stroke="url(#blue)" stroke-width="4"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="52" y="46" width="5" height="18" rx="2.5" fill="#75aaff"/>
      <text x="70" y="60" fill="#c2cfe8" font-size="14" font-weight="700" letter-spacing="3.2">ZIA UL HUSSAIN</text>
      <text x="52" y="114" fill="#869bbf" font-size="13" letter-spacing="2.4">SOFTWARE ENGINEER</text>
      <text x="49" y="183" fill="#f1f5ff" font-size="53" font-weight="700" letter-spacing="-1.7">Building useful things.</text>
      <text x="49" y="247" fill="url(#blue)" font-size="53" font-weight="700" letter-spacing="-1.7">With code &amp; AI.</text>
      <text x="53" y="290" fill="#a0aec8" font-size="16">From a real problem to a working product.</text>
      <g transform="translate(52 330)" font-size="11" font-weight="700" letter-spacing="1.1" fill="#c4d5f8">
        <rect width="147" height="30" rx="15" fill="#162643" stroke="#294366"/>
        <text x="73.5" y="19" text-anchor="middle">AI ENGINEERING</text>
        <rect x="158" width="128" height="30" rx="15" fill="#162643" stroke="#294366"/>
        <text x="222" y="19" text-anchor="middle">FULL-STACK</text>
        <rect x="297" width="77" height="30" rx="15" fill="#162643" stroke="#294366"/>
        <text x="335.5" y="19" text-anchor="middle">SAAS</text>
      </g>
    </g>
    <g transform="translate(960 199)" fill="none">
      <circle r="145" stroke="#344c77" stroke-opacity=".46"/>
      <circle r="113" stroke="#476492" stroke-opacity=".3" stroke-dasharray="3 8"/>
      <ellipse rx="179" ry="68" transform="rotate(-33)" stroke="url(#blue)" stroke-opacity=".68"/>
      <ellipse rx="179" ry="68" transform="rotate(36)" stroke="#5894ef" stroke-opacity=".24"/>
      <path d="M-68-58L0-97L68-58V20L0 59L-68 20Z" fill="#12213d" stroke="#4d75ac"/>
      <path d="M-68-35L0 4L68-35M0 4V59" stroke="#608bc3" stroke-opacity=".5"/>
      <path d="M-68-3L0 36L68-3M-68 20V53L0 92L68 53V20" stroke="#4f78ae" stroke-opacity=".55"/>
      <path d="M-68 52V80L0 119L68 80V52" stroke="#355680" stroke-opacity=".6"/>
      <text x="0" y="-30" fill="#d9e8ff" stroke="none" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="3">ZH</text>
      <circle cx="150" cy="-93" r="5" fill="#8ebdff" stroke="#1d345a" stroke-width="5"/>
      <circle cx="-131" cy="83" r="4" fill="#8798ff"/>
      <circle cx="50" cy="-136" r="3" fill="#638fcc"/>
    </g>
    <text x="1150" y="365" fill="#637a9e" font-family="monospace" font-size="10" text-anchor="end" letter-spacing="2">THINK / BUILD / REFINE</text>
  </g>
</svg>
